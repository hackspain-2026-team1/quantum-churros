[project]
name = "xray-engine"
version = "0.1.0"
description = "Temporal and explainable financial health scoring engine"
requires-python = ">=3.12"
dependencies = [
    "catboost>=1.2.8",
    "numpy>=2.0",
    "pandas>=2.2",
    "polars>=1.35.2",
    "pyarrow>=20.0",
    "pydantic>=2.12.4",
    "scikit-learn>=1.6",
    "scipy>=1.15",
    "typer>=0.16.0",
]

[project.scripts]
xray-score = "xray_engine.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xray_engine"]

[dependency-groups]
dev = ["pytest>=8.4.0"]
