name: CI and deploy

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quantum-churros-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate-deployment-identity:
    name: Validate deployment identity
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: development
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Validate GitHub OIDC claims
        env:
          EXPECTED_OIDC_SUBJECT: repo:${{ github.repository_owner }}@${{ github.repository_owner_id }}/${{ github.event.repository.name }}@${{ github.repository_id }}:environment:development
          OIDC_AUDIENCE: ${{ secrets.TS_OIDC_AUDIENCE }}
        run: |
          response=$(curl --fail-with-body --silent --show-error \
            --get \
            --data-urlencode "audience=$OIDC_AUDIENCE" \
            --header "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL")
          token=$(jq --exit-status --raw-output '.value' <<<"$response")
          claims=$(OIDC_TOKEN="$token" python3 -c 'import base64, json, os; payload = os.environ["OIDC_TOKEN"].split(".")[1]; payload += "=" * (-len(payload) % 4); print(json.dumps(json.loads(base64.urlsafe_b64decode(payload))))')
          jq '{iss, aud, sub, repository, ref, environment, job_workflow_ref}' <<<"$claims"
          jq --exit-status \
            --arg audience "$OIDC_AUDIENCE" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg subject "$EXPECTED_OIDC_SUBJECT" \
            '.iss == "https://token.actions.githubusercontent.com" and .aud == $audience and .repository == $repository and .sub == $subject' \
            <<<"$claims" >/dev/null

  verify:
    name: Verify application
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --locked --all-packages --all-groups

      - name: Test Python
        run: uv run pytest backend/tests engine/tests -q

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Check and build frontend
        working-directory: frontend
        run: bun run check && bun run build:despliegue

  build-images:
    name: Build ${{ matrix.name }} image
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: api
            dockerfile: docker/backend.Dockerfile
          - name: web
            dockerfile: docker/frontend.Dockerfile
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and optionally publish image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name == 'push' }}
          tags: ghcr.io/${{ github.repository }}-${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Record published image digest
        if: github.event_name == 'push'
        run: printf '%s\n' '${{ steps.build.outputs.digest }}' > '${{ matrix.name }}.digest'

      - name: Upload published image digest
        if: github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.name }}-digest
          path: ${{ matrix.name }}.digest
          retention-days: 1

  deploy-development:
    name: Deploy development
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build-images, validate-deployment-identity]
    runs-on: ubuntu-24.04
    environment: development
    permissions:
      contents: read
      id-token: write
      packages: read
    steps:
      - name: Download published image digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: '*-digest'
          path: digests
          merge-multiple: true

      - name: Connect to the deployment tailnet
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_OIDC_CLIENT_ID }}
          audience: ${{ secrets.TS_OIDC_AUDIENCE }}
          tags: tag:github-ci
          ping: ${{ vars.DEPLOY_HOST }}
          retry: 1
          timeout: 30s

      - name: Configure SSH host verification
        env:
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy immutable images
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          GHCR_TOKEN: ${{ github.token }}
        run: |
          api_digest=$(<digests/api.digest)
          web_digest=$(<digests/web.digest)
          printf '%s\n' "$GHCR_TOKEN" | ssh \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "quantum-deploy@$DEPLOY_HOST" \
            "deploy ${{ github.sha }} ${{ github.actor }} $api_digest $web_digest"
