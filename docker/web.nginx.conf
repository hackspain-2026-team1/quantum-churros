worker_processes auto;
pid /tmp/nginx.pid;
error_log /tmp/nginx-error.log warn;

events {
	worker_connections 512;
}

http {
	include /etc/nginx/mime.types;
	default_type application/octet-stream;
	access_log off;
	sendfile on;
	tcp_nopush on;
	gzip on;
	gzip_types application/javascript application/json text/css image/svg+xml;

	client_body_temp_path /tmp/nginx/client;
	proxy_temp_path /tmp/nginx/proxy;
	fastcgi_temp_path /tmp/nginx/fastcgi;
	uwsgi_temp_path /tmp/nginx/uwsgi;
	scgi_temp_path /tmp/nginx/scgi;

	server {
		listen 3000;
		root /app/dist;
		index index.html;

		# El HTML manda el mismo nombre en cada reconstrucción: se guarda pero
		# siempre se revalida, así que una imagen nueva se ve al recargar.
		location = /index.html {
			add_header Cache-Control "no-cache";
		}
		# Los datos del motor y de Rumbo se montan fuera de la imagen: revalidar.
		location /data/ {
			add_header Cache-Control "no-cache";
		}
		# El resto lleva el hash de contenido en el nombre: caché de un año.
		location /assets/ {
			add_header Cache-Control "public, max-age=31536000, immutable";
		}
		location / {
			try_files $uri $uri/ /index.html;
			add_header Cache-Control "no-cache";
		}
	}
}
