services:
  postgres:
    image: postgres:16.10-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-xray}
      POSTGRES_USER: ${POSTGRES_USER:-xray}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-xray-local}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 4g
    networks: [xray]

  mailpit:
    image: axllent/mailpit:v1.31.0
    restart: unless-stopped
    environment:
      MP_LABEL: Embat X-Ray · correo simulado
      MP_MAX_MESSAGES: 500
    ports:
      - "${MAILPIT_HTTP_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 3s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 256m
    networks: [xray]

  notifier:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    restart: "no"
    environment:
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      NOTIFICATION_FROM: Embat X-Ray <xray@embat.test>
      FRONTEND_BASE_URL: ${ORIGIN:-http://localhost:3000}
      MAILPIT_API_URL: http://mailpit:8025
    volumes:
      - ./bundle:/app/bundle:ro
    command: ["xray-db", "notify-demo", "/app/bundle", "--clear"]
    depends_on:
      mailpit:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256m
    networks: [xray]

  api:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://xray:xray-local@postgres:5432/xray}
      XRAY_DATA_DIR: /data/raw
      XRAY_BUNDLE_DIR: /app/bundle
      XRAY_HORIZONS_DIR: /app/rumbo/horizons
      XRAY_ENTITY_ALIASES_PATH: /app/rumbo/entities.json
      FINANCING_DEMO_ENABLED: "true"
    volumes:
      - ./data/raw:/data/raw:ro
      - ./artifacts:/app/artifacts
      - ./bundle:/app/bundle
      - ./rumbo:/app/rumbo
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 4g
    networks: [xray]

  web:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 3000
    volumes:
      - ./bundle:/usr/share/nginx/html/data/v1:ro
      - ./rumbo:/usr/share/nginx/html/data/rumbo:ro
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 4g
    networks: [xray]

volumes:
  postgres_data:

networks:
  xray:
