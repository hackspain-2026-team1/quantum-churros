name: quantum-churros

services:
  postgres:
    image: postgres:16.10-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: xray
      POSTGRES_USER: xray
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xray -d xray"]
      interval: 5s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 2g
    networks: [xray]

  api:
    image: ${API_IMAGE:?API_IMAGE is required}
    pull_policy: always
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://xray:${POSTGRES_PASSWORD}@postgres:5432/xray
      CORS_ORIGINS: ${ORIGIN:-http://localhost:3101}
      SCORES_PATH: /app/artifacts/scores.parquet
      XRAY_BUNDLE_DIR: /app/bundle
    volumes:
      - ./artifacts:/app/artifacts:ro
      - ./bundle:/app/bundle:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 2g
    networks: [xray]

  mailpit:
    image: axllent/mailpit:v1.31.0
    restart: unless-stopped
    environment:
      MP_LABEL: Embat X-Ray · correo simulado
      MP_MAX_MESSAGES: 500
    ports:
      - "${MAILPIT_BIND:-127.0.0.1}:${MAILPIT_HTTP_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 256m
    networks: [xray]

  notifier:
    image: ${API_IMAGE:?API_IMAGE is required}
    profiles: [notify]
    restart: "no"
    environment:
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      NOTIFICATION_FROM: Embat X-Ray <xray@embat.test>
      FRONTEND_BASE_URL: ${ORIGIN:-http://localhost:3101}
      MAILPIT_API_URL: http://mailpit:8025
    volumes:
      - ./bundle:/app/bundle:ro
    command: ["xray-db", "notify-demo", "/app/bundle", "--clear"]
    depends_on:
      mailpit:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256m
    networks: [xray]

  web:
    image: ${WEB_IMAGE:?WEB_IMAGE is required}
    pull_policy: always
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 3000
    volumes:
      - ./bundle:/app/dist/data/v1:ro
      - ./rumbo:/app/dist/data/rumbo:ro
    ports:
      - "127.0.0.1:${WEB_PORT:-3101}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000"]
      interval: 5s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 1g
    networks: [xray]

volumes:
  postgres_data:

networks:
  xray:
