[project]
name = "quantum-churros-api"
version = "0.1.0"
description = "FastAPI surface for Embat X-Ray"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.121.2",
    "pydantic-settings>=2.12.0",
    "psycopg[binary]>=3.2.0",
    "sqlmodel>=0.0.24",
    "typer>=0.16.0",
    "uvicorn[standard]>=0.38.0",
    "xray-engine",
    "alembic>=1.20.0",
]

[tool.uv.sources]
xray-engine = { workspace = true }

[project.scripts]
xray-db = "app.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = ["httpx>=0.28.1", "pytest>=8.4.0"]
